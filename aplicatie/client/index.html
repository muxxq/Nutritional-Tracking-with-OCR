<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NutriScan" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriScan</title>
    <meta name="description" content="Monitorizare nutrițională cu scanarea etichetelor" />
    <script>
      // Applied before the first paint, so a dark-theme user never sees a white flash. Same rule as src/lib/theme.ts.
      try {
        var stored = localStorage.getItem('nutriscan-theme')
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
