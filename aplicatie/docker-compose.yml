services:
  # -------------------------------------------------------------
  # 1. BAZA DE DATE POSTGRESQL
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nutriscan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutriscan_db}
      POSTGRES_USER: ${POSTGRES_USER:-nutriscan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Setați POSTGRES_PASSWORD în aplicatie/.env (vezi .env.example)}
    ports:
      # Host port configurable (POSTGRES_PORT in .env), so NutriScan can run next to another project's PostgreSQL
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nutriscan-network

  # -------------------------------------------------------------
  # 2. MICROSERVICIU OCR (PYTHON FASTAPI)
  # -------------------------------------------------------------
  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    container_name: nutriscan-ocr
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=development
    networks:
      - nutriscan-network

  # -------------------------------------------------------------
  # 3. BACKEND CORE (.NET 8 WEB API)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutriscan-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ocr-service:
        condition: service_started
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-nutriscan_db};Username=${POSTGRES_USER:-nutriscan_user};Password=${POSTGRES_PASSWORD:?Setați POSTGRES_PASSWORD în aplicatie/.env}
      - OcrService__BaseUrl=http://ocr-service:8000
      - Jwt__Secret=${JWT_SECRET:?Setați JWT_SECRET în aplicatie/.env (vezi .env.example)}
      - Jwt__Issuer=NutriScanApi
      - Jwt__Audience=NutriScanClient
    networks:
      - nutriscan-network

  # -------------------------------------------------------------
  # 4. FRONTEND CLIENT (REACT PWA)
  # -------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nutriscan-client
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      # Vite proxies /api to the backend over the internal network (same-origin API, ADR-011)
      - VITE_API_PROXY_TARGET=http://backend:8080
    networks:
      - nutriscan-network

networks:
  nutriscan-network:
    driver: bridge

volumes:
  postgres_data:
