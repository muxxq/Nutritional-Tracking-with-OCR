# The client's type check, lint and tests on every push that touches it (or the API contract it is generated from).
name: Client CI

on:
  push:
    paths: ["aplicatie/client/**", "aplicatie/backend/openapi.json", ".github/workflows/client-ci.yml"]
  pull_request:
    paths: ["aplicatie/client/**", "aplicatie/backend/openapi.json", ".github/workflows/client-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aplicatie/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: aplicatie/client/package-lock.json

      - run: npm ci

      # The generated types must match the committed contract: regenerate and fail on any difference.
      - name: API types up to date
        run: npm run api:types && git diff --exit-code src/api/schema.d.ts

      - run: npm run lint
      - run: npm run build
      - run: npm test
